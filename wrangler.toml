# Hosted (remote) micropage MCP server: streamable HTTP at /mcp, OAuth via
# the Supabase OAuth server. Development only from this repo: nothing here is
# part of the npm package (tsconfig.json excludes src/remote from dist).
#
#   npm run dev:remote      local wrangler dev
#   npm run deploy:remote   wrangler deploy (production: coordinate first)
name = "micropage-mcp-remote"
main = "src/remote/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Served only on the mcp.micropage.sh Custom Domain (Cloudflare manages its DNS
# record). No zone routes: the micropage.sh zone's */* route belongs to
# micropage-custom-hostnames-fallback, which excludes mcp.micropage.sh/*.
# workers_dev stays off so the Worker has one public host, the one RESOURCE_URL names.
routes = [{ pattern = "mcp.micropage.sh", custom_domain = true }]
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Our own console.log lines (src/remote/log.ts) are written without secrets.
# The platform's per-request invocation logs carry request metadata that this
# code does not control, and Cloudflare does not document that they redact
# the Authorization header, so they are off.
[observability.logs]
invocation_logs = false

[vars]
# Public URL of the MCP endpoint; the `resource` in the protected-resource
# metadata. It must be the URL users enter (now the Custom Domain);
# the Worker refuses to serve otherwise: until a valid https URL is set
# it answers /mcp and the metadata with 500 (and logs
# config_error RESOURCE_URL_PLACEHOLDER): it refuses a URL containing REPLACE
# or one that is not https.
RESOURCE_URL = "https://mcp.micropage.sh/mcp"
SUPABASE_URL = "https://vhlifcdslnmnvnvorluu.supabase.co"
# Public anon key, the same one the editor and the CLI ship.
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZobGlmY2RzbG5tbnZudm9ybHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjUxMTUzMTMsImV4cCI6MjA0MDY5MTMxM30.IprHOpa397Wcv5iFwa_e9hkXhhmXYZFXC4BF_qGYkkk"
# Comma-separated browser Origin hostnames allowed to call /mcp (e.g.
# "claude.ai"). Requests without an Origin header (server-side MCP clients)
# always pass; an Origin not listed here gets 403.
ALLOWED_ORIGINS = ""
# OpenAI apps domain-verification token, served as text/plain at
# /.well-known/openai-apps-challenge. Unset or empty: that path answers 404.
# Set it here (or with `wrangler secret put`) only when OpenAI asks for it:
# OPENAI_APPS_CHALLENGE = ""

# Secrets (not vars), set with `wrangler secret put <NAME>`:
#   MCP_CONFIRM_KEY  at least 32 random characters; signs preview_post_send
#                    confirmation tokens. Rotating it invalidates outstanding
#                    previews (15 min). Generate with: openssl rand -base64 48
# No request-state key: the server mints no MRTR requestState.

# Per-user limit: keyed by the OAuth token's sub, or by the deploy token's hash.
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "5001"
simple = { limit = 120, period = 60 }

# Per-IP limit (cf-connecting-ip) on presented credentials this isolate has not
# verified yet, checked before Supabase is asked about them.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "5002"
simple = { limit = 30, period = 60 }
